/* Scrollen naar beneden: eerst de pagina (of het venster eromheen, bijv. Beheren), pas als die onderaan is een tabel of lijst met een eigen schuifbalk.
   Naar boven scrollen werkt zoals de browser het doet (eerst de tabel terug, dan de pagina). */
(function(){const can=e=>{const s=getComputedStyle(e).overflowY;return(s==='auto'||s==='scroll')&&e.scrollHeight>e.clientHeight+1};
  const room=e=>e.scrollHeight-e.clientHeight-e.scrollTop>1;
  document.addEventListener('wheel',ev=>{if(ev.ctrlKey||ev.defaultPrevented||ev.deltaY<=0||Math.abs(ev.deltaX)>Math.abs(ev.deltaY))return;
    const t=ev.target;if(!(t instanceof Element)||t.closest('textarea,select,input'))return;
    const ch=[];let fixed=false;for(let e=t;e&&e!==document.body&&e!==document.documentElement;e=e.parentElement){if(can(e))ch.push(e);if(getComputedStyle(e).position==='fixed'){fixed=true;break}}
    if(!ch.length)return;if(!fixed)ch.push(document.scrollingElement||document.documentElement);
    for(let i=ch.length-1;i>0;i--)if(room(ch[i])){ev.preventDefault();ch[i].scrollBy(0,ev.deltaY*(ev.deltaMode===1?16:ev.deltaMode===2?innerHeight:1));return}
  },{passive:false,capture:true})})();

function plData(){
  const key=[PLREV,S.tx.length,S.dg.length,pfsKey(),F.bank,[...ACS].sort().join(','),S.anchor,PER==='month'?'m':'a',JSON.stringify(S.dgpx||{}).length,(typeof PX!=='undefined'&&PX?PX.bijgewerkt:'')].join('|');
  if(PLC&&PLCK===key)return PLC;
  intPrep();
  const B=S.tx.filter(t=>accOk(t.acct)&&!isInt(t));
  if(!B.length){PLC={empty:true};PLCK=key;return PLC}
  let asOf='0000',first='9999';B.forEach(t=>{if(t.date>asOf)asOf=t.date;if(t.date<first)first=t.date});
  const P={};
  for(const t of B){const k=plK(t.date),p=P[k]||(P[k]={k,inc:0,exp:0,n:0,g:{},day:{},T:[]});p.n++;p.T.push(t);
    if(t.amt>0)p.inc+=t.amt;else{const a=-t.amt;p.exp+=a;const g=gOf(t);p.g[g]=(p.g[g]||0)+a;const o=dDiff(k,t.date);p.day[o]=(p.day[o]||0)+a}}
  const cur=plK(asOf),ks=Object.keys(P).sort(),past=ks.filter(k=>k<cur),mn=medOf(past.map(k=>P[k].n));
  const valid=past.filter(k=>P[k].n>=Math.max(3,mn*.4)),F12=valid.slice(-12);
  const cum=k=>{const a=[],n=dDiff(k,plEnd(k))+1;let s=0;for(let i=0;i<n;i++){s+=P[k].day[i]||0;a.push(s)}return a};
  const C12=F12.map(cum),med=f=>F12.length?medOf(F12.map(f)):0;
  const typ={exp:med(k=>P[k].exp),inc:med(k=>P[k].inc)};
  const gset=new Set();F12.forEach(k=>Object.keys(P[k].g).forEach(g=>gset.add(g)));if(P[cur])Object.keys(P[cur].g).forEach(g=>gset.add(g));
  const gS=[...gset].map(g=>{const v=F12.map(k=>P[k].g[g]||0);return{g,v,med:medOf(v),avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:0,cur:(P[cur]&&P[cur].g[g])||0,last:F12.length?(P[F12[F12.length-1]].g[g]||0):0}}).sort((a,b)=>b.med-a.med||b.cur-a.cur);
  const si=F12.reduce((a,k)=>a+P[k].inc,0),se=F12.reduce((a,k)=>a+P[k].exp,0);
  const D={B,P,ks,cur,asOf,first,valid,F12,C12,typ,gS,avgSave:F12.length?(si-se)/F12.length:0,rate:si>0?(si-se)/si:0,si,se};
  D.rec=plRecur(B,asOf);D.worth=plWorth();D.sig=plSignals(D);
  PLC=D;PLCK=key;return D}

function plRecur(B,asOf){const lo=addD(asOf,-430),by={};
  for(const t of B){if(t.date<lo)continue;const nm=uname(t),dd=t.kind==='Direct debit'||t.kind==='Standing order';
    const key=(t.amt<0?'-':'+')+'|'+nm+(dd?'':'|'+Math.round(Math.abs(t.amt)/Math.max(1,Math.abs(t.amt)*.08)));
    (by[key]=by[key]||{nm,sign:t.amt<0?-1:1,L:[]}).L.push(t)}
  const out=[];
  for(const o of Object.values(by)){const dm={};o.L.forEach(t=>{dm[t.date]=(dm[t.date]||0)+Math.abs(t.amt)});
    const ds=Object.keys(dm).sort();if(ds.length<3)continue;
    const gaps=[];for(let i=1;i<ds.length;i++)gaps.push(dDiff(ds[i-1],ds[i]));
    const gm=medOf(gaps);let per=null;
    if(gm>=26&&gm<=35)per='m';else if(gm>=6&&gm<=8)per='w';else if(gm>=13&&gm<=16)per='2w';else if(gm>=85&&gm<=95)per='q';else if(gm>=350&&gm<=380)per='y';
    if(!per)continue;
    if(gaps.filter(g=>Math.abs(g-gm)<=Math.max(4,gm*.2)).length/gaps.length<.7)continue;
    const am=ds.map(d=>dm[d]),last=am[am.length-1],typ=medOf(am.slice(-3)),prev=am.slice(-5,-1),pm=medOf(prev);
    const mean=prev.length?prev.reduce((a,b)=>a+b,0)/prev.length:0,cvp=mean?Math.sqrt(prev.reduce((a,b)=>a+(b-mean)**2,0)/prev.length)/mean:1;
    const lastD=ds[ds.length-1],lt=o.L.find(t=>t.date===lastD);
    const step=d=>per==='m'?addM(d,1):per==='q'?addM(d,3):per==='y'?addM(d,12):addD(d,Math.round(gm));
    const next=step(lastD),mul=per==='m'?12:per==='q'?4:per==='y'?1:per==='w'?52:26;
    out.push({nm:o.nm,sign:o.sign,per,gap:gm,n:ds.length,first:ds[0],last:lastD,lastA:last,typ,pm,cvp,am,next,step,yearly:typ*mul,g:gOf(lt),kind:lt.kind,ids:o.L.map(t=>t.id),
      stale:dDiff(next,asOf)>Math.max(10,gm*.6)})}
  return out.sort((a,b)=>b.yearly-a.yearly)}

  for(const a in E){if(a!=='?'&&!accOk(a))continue;const r=E[a];if(!r||!r.length)continue;const v=r[r.length-1][1],k=S.akind[a]||G[a]||'betaal';acc.push({a,v,k,d:r[r.length-1][0]});if(r[r.length-1][0]>last)last=r[r.length-1][0];
    if(k==='beleg')beleg+=v;else if(k==='spaar')spaar+=v;else betaal+=v}
  let dg=0,dgc=0,dgp=0,dgn=0;
  if(S.dg.length){try{const C=dgCalc(),px=S.dgpx||{},PP=typeof pxCalc==='function'?pxCalc():null;if(PP){dg=PP.V[PP.V.length-1];dgp=dgn=PP.hold.length;dgc=(C.cash&&C.cash.EUR)||0;throw 0}C.pos.forEach(p=>{const pr=px[p.i];if(pr!=null){dg+=p.q*pr/(p.ccy==='EUR'?1:(C.rl[p.ccy]||1));dgp++}else dg+=p.cost;dgn++});dgc=(C.cash&&C.cash.EUR)||0}catch(e){}}
  /* fondsen op de beleggersrekening (bijv. ABN "Storting beleg. fonds"): geen koersen bekend, dus tegen inleg, precies zoals Liquide in Inzicht › Vermogen */

  // saldoverloop (bank) per week, laatste jaar
  const hist=[];if(last){for(let i=52;i>=0;i--){const d=addD(last,-7*i);let s=0;for(const x of acc){const r=E[x.a];let lo=0,hi=r.length-1,b=null;while(lo<=hi){const m=(lo+hi)>>1;if(r[m][0]<=d){b=r[m][1];lo=m+1}else hi=m-1}if(b!=null)s+=b}hist.push(s)}}
  return{betaal,spaar,beleg,dg,dgc,dgp,dgn,fond,bel:dg+dgc+fond,acc,hist,cash:betaal+spaar,inv:beleg+dg+dgc+fond,tot:betaal+spaar+beleg+dg+dgc+fond}}

  if(D.P[k]&&el/days<.85){for(const g of D.gS){if(g.g==='Ungrouped'||g.med<40)continue;if(g.cur>g.med*1.15&&g.cur-g.med>=40){const ids=D.P[k].T.filter(t=>t.amt<0&&gOf(t)===g.g).map(t=>t.id);out.push({l:'warn',i:'⏱',t:`${gd(g.g)}: nu al boven je normale maand`,d:`Dag ${el} van ${days}: ${fmt(g.cur)} uitgegeven, normaal ${fmt(g.med)} voor de hele periode.`,go:go(ids,gd(g.g)+' · deze periode')})}}}
  for(const g in b){const x=D.gS.find(y=>y.g===g);if(x&&x.cur>b[g]){const ids=(D.P[k]?D.P[k].T:[]).filter(t=>t.amt<0&&gOf(t)===g).map(t=>t.id);out.push({l:'bad',i:'€',t:`Budget ${gd(g)} overschreden`,d:`${fmt(x.cur)} van ${fmt(b[g])} (${pct(x.cur,b[g])}%) in deze periode.`,go:go(ids,'Budget '+gd(g))})}}
  const lo=addD(A,-90),E=D.B.filter(t=>t.amt<=-10&&t.date>=lo).sort((x,y)=>x.date<y.date?-1:1),seen=new Set();

const PVRX=/[−-]?\s?€\s?[−-]?\d[\d.,]*(?:\s?(?:k|mln|mld)\b)?/g;
function pvMask(root){if(typeof root==='string')root=document.querySelector(root);if(!root||!document.body.classList.contains('pv'))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||p.closest('script,style,textarea,select,option,input,svg,.pva'))return NodeFilter.FILTER_REJECT;PVRX.lastIndex=0;return PVRX.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
  const L=[];while(w.nextNode())L.push(w.currentNode);
  for(const n of L){const t=n.nodeValue,f=document.createDocumentFragment();let i=0,m;PVRX.lastIndex=0;while((m=PVRX.exec(t))){if(m.index>i)f.appendChild(document.createTextNode(t.slice(i,m.index)));const sp=document.createElement('span');sp.className='pva';sp.textContent=m[0];f.appendChild(sp);i=m.index+m[0].length}if(i<t.length)f.appendChild(document.createTextNode(t.slice(i)));n.parentNode.replaceChild(f,n)}
  root.querySelectorAll('[title]').forEach(e=>{const t=e.getAttribute('title');if(t&&t.includes('€'))e.setAttribute('title',t.replace(PVRX,'€ •••'))});
  root.querySelectorAll('svg title').forEach(e=>{if(e.textContent.includes('€'))e.textContent=e.textContent.replace(PVRX,'€ •••')})}

function vpData(){const W=plWorth(),aname=a=>((S.alias||{})[a]||('rekening …'+String(a).slice(-4)))+((S.banks||{})[a]?' · '+S.banks[a]:'');

  let pos=[];try{const C=S.dg.length?dgCalc():null;if(C)pos=C.pos.map(q=>{const L=pxLast(q.i),e=L?pxEur(q.i,L.d):null;return{n:q.p,v:e!=null?q.q*e:q.cost,est:e==null}}).sort((a,b)=>b.v-a.v)}catch(e){}
  let afl=0;try{const V=plHeroVA();afl=V?V.afl:0}catch(e){}
  const C=[{k:'betaal',l:'Betaalrekeningen',c:'--vp1',v:W.betaal,sub:acc('betaal'),go:"bhOpen('s6')"},
    {k:'spaar',l:'Spaarrekeningen',c:'--vp2',v:W.spaar+W.beleg,sub:acc('spaar'),go:"bhOpen('s6')"},
    {k:'dg',l:'Aandelen en ETF’s (DEGIRO)',c:'--vp3',v:W.dg,sub:pos,go:"tab='dgp';render()"},
    {k:'dgc',l:'Cash bij DEGIRO',c:'--vp4',v:W.dgc,sub:[]},
    {k:'fond',l:'Fondsen op beleggersrekening',c:'--vp5',v:W.fond||0,sub:[],note:'tegen inleg (geen koersen bekend)'},

function plCum(D,k,el,days,p,fc){const Wd=chW(680),H=300,ml=50,mr=14,mt=14,mb=28,arr=D.C12.map(c=>{const a=c.slice(0,days);while(a.length<days)a.push(a[a.length-1]||0);return a});

/* ---------- Maandelijkse begroting (S.plan.beg) ----------
   Personen, secties (soort: ink/teg/uit/spa/bel) en posten. Een post heeft bedragen per kolom: 's' = samen (gezamenlijk) en per persoon.
   Het samen-bedrag wordt over de personen verdeeld volgens 'vd': 'ink' (naar inkomen), 'gel' (gelijk) of een persoon-id.
   Uitgavenposten kunnen aan groepen gekoppeld worden; dan vergelijkt de app met wat je werkelijk uitgaf. Geen persoonlijke gegevens hier: alles staat in S.plan. */
var BGW=(()=>{try{return localStorage.getItem('pftBgW')||'avg3'}catch(e){return'avg3'}})(),BGED=null,BGDEL=null;
const BGSRT={ink:'Inkomen',teg:'Tegemoetkoming (toeslag, aftrek)',uit:'Uitgaven',spa:'Sparen',bel:'Beleggen'};
const BGWIN=[['last','Laatste volle maand'],['avg3','Gemiddeld, laatste 3 maanden'],['avg6','Gemiddeld, laatste 6 maanden'],['avg12','Gemiddeld, laatste 12 maanden'],['med12','Typische maand (mediaan, 12 maanden)']];
const bgId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function bgS(){const P=plS(),b=P.beg;return b&&typeof b==='object'&&Array.isArray(b.secties)&&Array.isArray(b.personen)?b:null}
function bgTpl(){const L=(naam,o)=>Object.assign({id:bgId(),naam,b:{},vd:'ink',g:[]},o||{});
  return{naam:'Maandelijkse begroting',personen:[{id:'p1',naam:'Persoon 1'},{id:'p2',naam:'Persoon 2'}],secties:[
    {id:bgId(),naam:'Inkomen',soort:'ink',regels:[L('Salaris netto'),L('Vergoedingen (reiskosten e.d.)')]},

    {id:bgId(),naam:'Tegemoetkomingen',soort:'teg',regels:[L('Toeslagen',{vd:'gel'})]},
    {id:bgId(),naam:'Persoonlijke uitgaven',soort:'uit',regels:[L('Zorgverzekering'),L('Telefoon')]},
    {id:bgId(),naam:'Sparen',soort:'spa',regels:[L('Sparen')]},
    {id:bgId(),naam:'Beleggen',soort:'bel',regels:[L('Beleggen')]}]}}
/* gebruik de groepnamen van de app als die op een post lijken (alleen bij een nieuwe begroting) */
function bgAutoLink(B){const gs=bgGroups(),find=re=>gs.find(g=>re.test(g));
  const M=[[/hypotheek|huur/i,/hypotheek|huur|wonen/i],[/energie|gas|stroom/i,/energie/i],[/verzeker/i,/verzeker/i],[/belasting|water|ozb|afval|riool/i,/belasting|water/i],[/boodschap/i,/boodschap/i],[/abonnement|telefoon|internet/i,/telecom|abonnement|telefoon/i],[/vervoer|brandstof|auto/i,/vervoer|auto/i]];
  B.secties.filter(s=>s.soort==='uit').forEach(s=>s.regels.forEach(l=>{if(l.g&&l.g.length)return;for(const[a,b]of M)if(a.test(l.naam)){const g=find(b);if(g){l.g=[g];break}}}))}
function bgGroups(){return gsort([...new Set(S.tx.map(gOf).concat(S.extra||[]))]).filter(g=>g&&g!=='Ungrouped')}
const bgN=v=>{const n=num(v);return isNaN(n)?0:Math.round(n*100)/100};
const bgTot=(l,B)=>{let s=+l.b.s||0;B.personen.forEach(p=>s+=+l.b[p.id]||0);return s};

/* verdeling over personen en totalen per soort */
function bgCalc(B){const P=B.personen,T={},pp={};const z=()=>({ink:0,teg:0,uit:0,uitS:0,uitP:0,spa:0,bel:0,afl:0});P.forEach(p=>pp[p.id]=z());const tot=z();
  const incP={};P.forEach(p=>incP[p.id]=0);B.secties.filter(s=>s.soort==='ink').forEach(s=>s.regels.forEach(l=>P.forEach(p=>incP[p.id]+=+l.b[p.id]||0)));
  const iT=P.reduce((a,p)=>a+incP[p.id],0),share=(vd,pid)=>vd===pid?1:P.some(p=>p.id===vd)?0:vd==='gel'||!(iT>0)?1/Math.max(1,P.length):incP[pid]/iT;
  for(const s of B.secties)for(const l of s.regels){const so=s.soort,sv=+l.b.s||0,t=bgTot(l,B);T[l.id]=t;tot[so]+=t;
    if(so==='uit'){tot.uitS+=sv;tot.uitP+=t-sv;tot.afl+=+l.afl||0}
    P.forEach(p=>{const sh=share(l.vd||'ink',p.id),own=+l.b[p.id]||0,v=own+sv*sh,o=pp[p.id];o[so]+=v;if(so==='uit'){o.uitS+=sv*sh;o.uitP+=own;o.afl+=(+l.afl||0)*(sv?sh:(t?own/t:0))}})}
  const fin=o=>{o.inT=o.ink+o.teg;o.over=o.inT-o.uit-o.spa-o.bel;o.lastN=o.uit-o.teg;o.verm=o.spa+o.bel+o.afl;return o};P.forEach(p=>fin(pp[p.id]));fin(tot);
  return{T,pp,tot,incP,iT,share}}

/* werkelijke cijfers per maand: inkomen, uitgaven, beleggen, sparen, en per gekoppelde post */
function bgAct(B,D){if(!D||D.empty)return null;const ks=D.F12.slice();if(!ks.length)return null;
  const inv={};intPrep();for(const t of S.tx){if(!accOk(t.acct))continue;const w=intWhy(t);if(!w||w.k!=='inv')continue;const k=plK(t.date);inv[k]=(inv[k]||0)-t.amt}
  const lines=[];B.secties.filter(s=>s.soort==='uit').forEach(s=>s.regels.forEach(l=>{if(l.g&&l.g.length)lines.push(l)}));
  const C=bgCalc(B),wg={};lines.forEach(l=>l.g.forEach(g=>{(wg[g]=wg[g]||[]).push(l)}));
  const M=ks.map(k=>{const p=D.P[k]||{inc:0,exp:0,g:{}},L={};let linked=0;
    for(const g in wg){const v=p.g[g]||0;if(!v)continue;linked+=v;const ls=wg[g],sw=ls.reduce((a,l)=>a+Math.max(0,C.T[l.id]),0);ls.forEach(l=>{L[l.id]=(L[l.id]||0)+v*(sw>0?Math.max(0,C.T[l.id])/sw:1/ls.length)})}
    lines.forEach(l=>{if(L[l.id]===undefined)L[l.id]=0});const bel=inv[k]||0;return{k,inc:p.inc,exp:p.exp,bel,sp:p.inc-p.exp-bel,rest:p.exp-linked,L}});
  return{ks,M,lines,wg}}
function bgWin(A,w){if(!A)return null;const M=A.M,n=w==='last'?1:w==='avg3'?3:w==='avg6'?6:12,S2=M.slice(-n);if(!S2.length)return null;
  const agg=f=>w==='med12'?medOf(S2.map(f)):S2.reduce((a,m)=>a+f(m),0)/S2.length,o={n:S2.length,ks:S2.map(m=>m.k),L:{}};
  ['inc','exp','bel','rest'].forEach(k=>o[k]=agg(m=>m[k]));o.sp=o.inc-o.exp-o.bel;A.lines.forEach(l=>o.L[l.id]=agg(m=>m.L[l.id]||0));return o}

/* score: uitgaven t.o.v. begroting (50%), posten binnen budget (20%), vermogensopbouw gehaald (30%) */
function bgScore(B,C,W,A){if(!W)return null;const t=C.tot,EB=t.uit+Math.max(0,t.over),r=EB>0?W.exp/EB:1;
  const s1=r<=1?100:Math.max(0,100-(r-1)*250);
  let ws=0,wt=0;(A?A.lines:[]).forEach(l=>{const b=C.T[l.id];if(!(b>0))return;const a=W.L[l.id]||0,q=a/b,sc=q<=1.05?1:Math.max(0,1-(q-1.05)*2);ws+=sc*b;wt+=b});
  const s2=wt>0?ws/wt*100:s1,TG=t.spa+t.bel,AC=W.sp+W.bel,s3=TG>0?Math.max(0,Math.min(1,AC/TG))*100:(AC>=0?100:0);
  const sc=Math.round(.5*s1+.2*s2+.3*s3);return{sc,s1:Math.round(s1),s2:Math.round(s2),s3:Math.round(s3),r,EB,TG,AC}}
const bgLbl=s=>s>=90?['Uitstekend','#a7f3d0']:s>=75?['Goed','#bbf7d0']:s>=60?['Redelijk','#fde68a']:['Aandacht nodig','#fca5a5'];
const bgCol=s=>s>=90?'var(--in)':s>=75?'#22a06b':s>=60?'#f59e0b':'var(--out)';

function bgDo(f){const B=bgS();if(!B)return;f(B);save();render()}
function bgFind(B,sid,lid){const s=B.secties.find(x=>x.id===sid);return s?[s,lid?s.regels.find(x=>x.id===lid):null]:[null,null]}
function bgSetL(sid,lid,f,v){bgDo(B=>{const[s,l]=bgFind(B,sid,lid);if(!l)return;if(f==='naam'||f==='nt'||f==='vd')l[f]=String(v).slice(0,120);else if(f==='afl')l.afl=bgN(v);else{const n=bgN(v);if(n)l.b[f]=n;else delete l.b[f]}})}
function bgSetS(sid,f,v){bgDo(B=>{const[s]=bgFind(B,sid);if(!s)return;if(f==='naam')s.naam=String(v).slice(0,80);else if(f==='soort'&&BGSRT[v])s.soort=v})}
function bgAddL(sid){bgDo(B=>{const[s]=bgFind(B,sid);if(s){const l={id:bgId(),naam:'Nieuwe post',b:{},vd:'ink',g:[]};s.regels.push(l);BGED=l.id}})}
function bgDelL(sid,lid){if(BGDEL!==lid){BGDEL=lid;render();setTimeout(()=>{if(BGDEL===lid){BGDEL=null;render()}},4000);return}BGDEL=null;bgDo(B=>{const[s]=bgFind(B,sid);if(s)s.regels=s.regels.filter(x=>x.id!==lid)})}
function bgMove(sid,lid,d){bgDo(B=>{const[s]=bgFind(B,sid);if(!s)return;const i=s.regels.findIndex(x=>x.id===lid),j=i+d;if(i<0||j<0||j>=s.regels.length)return;const t=s.regels[i];s.regels[i]=s.regels[j];s.regels[j]=t})}
function bgMoveS(sid,d){bgDo(B=>{const i=B.secties.findIndex(x=>x.id===sid),j=i+d;if(i<0||j<0||j>=B.secties.length)return;const t=B.secties[i];B.secties[i]=B.secties[j];B.secties[j]=t})}
function bgAddS(){const n=($('#bgsn')||{}).value||'',so=($('#bgss')||{}).value||'uit';if(!n.trim()){say('Geef de sectie een naam.');return}bgDo(B=>B.secties.push({id:bgId(),naam:n.trim().slice(0,80),soort:BGSRT[so]?so:'uit',regels:[]}))}
function bgDelS(sid){if(BGDEL!==sid){BGDEL=sid;render();setTimeout(()=>{if(BGDEL===sid){BGDEL=null;render()}},4000);return}BGDEL=null;bgDo(B=>B.secties=B.secties.filter(x=>x.id!==sid))}
function bgLink(sid,lid,g){if(!g)return;bgDo(B=>{const[,l]=bgFind(B,sid,lid);if(l){l.g=l.g||[];if(!l.g.includes(g))l.g.push(g)}})}
function bgUnlink(sid,lid,g){bgDo(B=>{const[,l]=bgFind(B,sid,lid);if(l)l.g=(l.g||[]).filter(x=>x!==g)})}
function bgPers(id,v){bgDo(B=>{const p=B.personen.find(x=>x.id===id);if(p&&String(v).trim())p.naam=String(v).trim().slice(0,40)})}
function bgAddP(){bgDo(B=>{let i=B.personen.length+1;while(B.personen.some(p=>p.id==='p'+i))i++;B.personen.push({id:'p'+i,naam:'Persoon '+i})})}
function bgDelP(id){const B=bgS();if(!B||B.personen.length<=1)return;if(BGDEL!==id){BGDEL=id;render();setTimeout(()=>{if(BGDEL===id){BGDEL=null;render()}},4000);return}BGDEL=null;
  bgDo(B=>{B.personen=B.personen.filter(p=>p.id!==id);B.secties.forEach(s=>s.regels.forEach(l=>{delete l.b[id];if(l.vd===id)l.vd='ink'}))})}
function bgName(v){bgDo(B=>{if(String(v).trim())B.naam=String(v).trim().slice(0,80)})}
function bgSetW(w){BGW=w;try{localStorage.setItem('pftBgW',w)}catch(e){}render()}
function bgStart(){const P=plS(),B=bgTpl();bgAutoLink(B);P.beg=B;save();render()}
function bgClear(){if(BGDEL!=='__all'){BGDEL='__all';render();setTimeout(()=>{if(BGDEL==='__all'){BGDEL=null;render()}},4000);return}BGDEL=null;delete plS().beg;save();render()}
function bgExport(){const B=bgS();if(!B)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({type:'pft-begroting',v:1,begroting:B},null,1)],{type:'application/json'}));a.download='begroting-'+plToday()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function bgImport(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;f.text().then(t=>{let o;try{o=JSON.parse(t)}catch(e){say('Dit is geen geldig begrotingsbestand (geen JSON).');return}
  const B=o&&o.begroting?o.begroting:o;if(!B||!Array.isArray(B.secties)||!Array.isArray(B.personen)||!B.personen.length){say('Dit is geen geldig begrotingsbestand.');return}
  if(bgS()&&!confirm('Je huidige begroting vervangen door "'+(B.naam||f.name)+'"?'))return;
  const ok=new Set(Object.keys(BGSRT)),pid=new Set(B.personen.map(p=>String(p.id)));
  const C={naam:String(B.naam||'Maandelijkse begroting').slice(0,80),personen:B.personen.map(p=>({id:String(p.id),naam:String(p.naam||p.id).slice(0,40)})),
    secties:B.secties.map(s=>({id:String(s.id||bgId()),naam:String(s.naam||'Sectie').slice(0,80),soort:ok.has(s.soort)?s.soort:'uit',regels:(s.regels||[]).map(l=>{const b={};for(const k in(l.b||{}))if((k==='s'||pid.has(k))&&+l.b[k])b[k]=Math.round(+l.b[k]*100)/100;
      return{id:String(l.id||bgId()),naam:String(l.naam||'Post').slice(0,120),b,vd:l.vd==='gel'||pid.has(l.vd)?l.vd:'ink',g:Array.isArray(l.g)?l.g.map(String):[],afl:+l.afl||0,nt:String(l.nt||'').slice(0,120)}})}))};
  plS().beg=C;save();render();const miss=[...new Set(C.secties.flatMap(s=>s.regels.flatMap(l=>l.g)))].filter(g=>!bgGroups().includes(g));
  say('Begroting "'+C.naam+'" geïmporteerd.'+(miss.length?' Deze gekoppelde groepen bestaan (nog) niet in de app: '+miss.join(', ')+'. Koppel de posten zo nodig opnieuw.':''))})}

function plBeg(D){const B=bgS();
  if(!B)return`<div class="pl-hero"><div style="position:relative;z-index:1"><h2>Maandelijkse begroting</h2><div class="pl-sub" style="max-width:720px">Zet je maandbegroting in de app: inkomen per persoon, gezamenlijke en persoonlijke lasten, toeslagen, sparen en beleggen. De app rekent uit wat iedereen bijdraagt en wat er overblijft, en geeft een <b>score</b> voor hoe je het werkelijk doet ten opzichte van je begroting.</div>

  const [lb,lc]=SC?bgLbl(SC.sc):['–','#fff'];

<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center"><select onchange="bgSetW(this.value)" style="max-width:300px;background:#fff;color:#0f4f40;border-color:rgba(255,255,255,.4)" title="Waarmee de begroting wordt vergeleken">${BGWIN.map(([k,l])=>`<option value="${k}" ${BGW===k?'selected':''}>${l}</option>`).join('')}</select></div></div>
${SC?`<div class="pl-hk" style="margin-top:0;flex:1.4;min-width:320px"><div${plTip('Uitgaven: werkelijk ten opzichte van je begrote uitgaven plus wat er volgens de begroting vrij te besteden is. Telt voor 50%.')}><span>Uitgaven · ${SC.s1}</span><b class="plv">${f0(W.exp)}</b><small>begroot ${f0(SC.EB)} (${pc(W.exp,SC.EB)})</small></div><div${plTip('Gekoppelde posten die binnen hun budget bleven (5% speling), gewogen naar bedrag. Telt voor 20%.')}><span>Posten binnen budget · ${SC.s2}</span><b class="plv">${A&&A.lines.length?A.lines.filter(l=>(W.L[l.id]||0)<=C.T[l.id]*1.05).length+' van '+A.lines.length:'–'}</b><small>${A&&A.lines.length?'gekoppelde posten':'koppel posten aan groepen'}</small></div><div${plTip('Sparen + beleggen: werkelijk ten opzichte van de begroting. Telt voor 30%.')}><span>Sparen + beleggen · ${SC.s3}</span><b class="plv">${f0(SC.AC)}</b><small>begroot ${f0(SC.TG)} (${pc(SC.AC,SC.TG)})</small></div></div>`:''}</div></div>`;
  // score per maand
  if(hist.length){const mx=100,Wd=chW(720),Hh=120,bw=Math.min(36,(Wd-20)/hist.length-6);h+=`<div class="c" style="margin-top:12px"><b>Score per maand</b> <span class="m">laatste ${hist.length} volle maanden, met dezelfde begroting</span><svg viewBox="0 0 ${Wd} ${Hh+26}" style="width:100%;max-width:${Wd}px;height:auto;display:block;margin-top:8px" role="img" aria-label="Score per maand">${hist.map((x,i)=>{const s=x.s?x.s.sc:0,cx=10+i*((Wd-20)/hist.length)+((Wd-20)/hist.length-bw)/2,hh=Math.max(2,s/mx*(Hh-16));return`<rect x="${cx}" y="${Hh-hh}" width="${bw}" height="${hh}" rx="4" fill="${bgCol(s)}"><title>${esc(plRange(x.k))}: score ${s} (uitgaven ${x.s.s1}, posten ${x.s.s2}, sparen+beleggen ${x.s.s3})</title></rect><text x="${cx+bw/2}" y="${Hh-hh-4}" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor">${s}</text><text x="${cx+bw/2}" y="${Hh+16}" text-anchor="middle" font-size="10.5" fill="var(--mut)">${esc(mLbl(x.k))}</text>`}).join('')}</svg></div>`}

    h+=`<div class="c tw" style="margin-top:12px"><b>Begroting tegenover werkelijk</b> <span class="m">per maand, ${esc(BGWIN.find(x=>x[0]===BGW)[1].toLowerCase())}</span><table style="margin-top:6px"><tr><th></th><th class="n">Begroot</th><th class="n">Werkelijk</th><th class="n">Verschil</th><th></th></tr>
${row('Inkomen (incl. tegemoetkomingen)',t.inT,W.inc,'lo','Al je inkomsten zonder eigen overboekingen. Toeslagen en belastingteruggaaf komen ook als inkomsten binnen.')}
${row('Uitgaven op gekoppelde posten',lk,W.exp-W.rest,'hi','Uitgaven in de groepen die je aan een post hebt gekoppeld')}
${row('Overige uitgaven',ulk+Math.max(0,t.over),W.rest,'hi','Alle uitgaven in groepen die aan geen post gekoppeld zijn, tegenover de niet-gekoppelde posten plus wat er vrij te besteden is')}
<tr class="tf">${row('Totaal uitgaven',SC.EB,W.exp,'hi').slice(4,-5)}</tr>
${row('Beleggen',t.bel,W.bel,'lo','Overboekingen naar een broker of fonds, min wat terugkomt')}
${row('Sparen (cash)',t.spa,W.sp,'lo','Inkomen min uitgaven min beleggen')}
${t.over<-.5?row('Tekort in de begroting',t.over,null):''}</table><p class="pl-note">Begroot klopt op dezelfde manier als werkelijk: uitgaven + beleggen + sparen = inkomen. “Vrij te besteden” (wat er in de begroting overblijft) telt mee als uitgavenbudget. Posten die je niet koppelt, zoals een onderhoudsreserve of het eigenwoningforfait, vallen onder overige uitgaven.</p></div>`}
  // per persoon
  const pr=(l,f,cl,tip)=>`<tr${tip?plTip(tip):''}${cl?` class="${cl}"`:''}><td>${l}</td>${P.map(p=>`<td class="n">${f0(f(C.pp[p.id]))}</td>`).join('')}<td class="n"><b>${f0(f(t))}</b></td><td class="n m">${pc(f(t),t.inT)}</td></tr>`;
  h+=`<div class="c tw" style="margin-top:12px"><b>Per persoon</b> <span class="m">per maand, volgens de begroting</span><table style="margin-top:6px"><tr><th></th>${P.map(p=>`<th class="n">${esc(p.naam)}</th>`).join('')}<th class="n">Totaal</th><th class="n">% inkomen</th></tr>
${pr('Inkomen',o=>o.ink)}${pr('Tegemoetkomingen (aandeel)',o=>o.teg)}${pr('Gezamenlijke lasten (aandeel)',o=>o.uitS,'','Het samen-bedrag van elke uitgavenpost, verdeeld naar inkomen, gelijk of naar één persoon (instelbaar per post via ⋯)')}${pr('Persoonlijke lasten',o=>o.uitP)}${pr('Totaal lasten na tegemoetkomingen',o=>o.lastN,'tf')}${pr('Sparen',o=>o.spa)}${pr('Beleggen',o=>o.bel)}${pr('Vrij te besteden (over)',o=>o.over,'tf','Inkomen + tegemoetkomingen − lasten − sparen − beleggen')}${t.afl?pr('Vermogensopbouw (sparen + beleggen + aflossing)',o=>o.verm,'','Inclusief het aflossingsdeel van je hypotheek (in te vullen per post via ⋯)'):''}</table>
<p class="pl-note">Verdeling naar inkomen: ${P.map(p=>esc(p.naam)+' '+(C.iT>0?Math.round(C.incP[p.id]/C.iT*1000)/10:Math.round(1000/P.length)/10)+'%').join(' · ')} (op basis van alle inkomensposten per persoon).</p></div>`;
  // de begroting zelf, per sectie
  const grs=bgGroups(),cols=[{id:'s',naam:'Samen'}].concat(P);
  h+=B.secties.map((s,si)=>{const so=s.soort,act=so==='uit'&&W,stot=s.regels.reduce((a,l)=>a+C.T[l.id],0);
    const rows=s.regels.map((l,li)=>{const tot=C.T[l.id],lk=act&&l.g&&l.g.length,a=lk?W.L[l.id]||0:null,d=lk?a-tot:0,ed=BGED===l.id;
      return`<tr><td style="min-width:200px"><input type="text" value="${esc(l.naam)}" onchange="bgSetL('${s.id}','${l.id}','naam',this.value)" style="width:100%;min-width:180px" aria-label="Naam van de post">${(l.g||[]).length||l.nt||l.afl?`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:3px">${(l.g||[]).map(g=>`<span class="pl-chip" style="background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);font-weight:600">${esc(gd(g))}</span>`).join('')}${l.afl?`<span class="pl-chip m">waarvan aflossing ${f0(l.afl)}</span>`:''}${l.nt?`<span class="m" style="font-size:11.5px">${esc(l.nt)}</span>`:''}</div>`:''}</td>
${cols.map(c=>`<td class="n"><input type="text" inputmode="decimal" value="${l.b[c.id]?String(l.b[c.id]).replace('.',','):''}" placeholder="–" onchange="bgSetL('${s.id}','${l.id}','${c.id}',this.value)" style="width:86px;text-align:right" aria-label="${esc(c.naam)}"></td>`).join('')}
<td class="n"><b>${f0(tot)}</b></td>${so==='uit'?`<td class="n">${lk?f0(a):`<span class="m"${plTip('Koppel deze post aan een of meer groepen (⋯) om hem met je werkelijke uitgaven te vergelijken')}>–</span>`}</td><td class="n ${lk?(d>tot*.05+0.5?'out':'in'):''}">${lk?(d>0?'+':'')+f0(d):''}</td>`:''}
<td style="white-space:nowrap"><button type="button" onclick="BGED=${ed?'null':`'${l.id}'`};render()" title="Koppelen, verdeling, notitie" aria-expanded="${ed}">⋯</button> <button type="button" onclick="bgMove('${s.id}','${l.id}',-1)" ${li?'':'disabled'} title="Omhoog">↑</button><button type="button" onclick="bgMove('${s.id}','${l.id}',1)" ${li<s.regels.length-1?'':'disabled'} title="Omlaag">↓</button> <button type="button" onclick="bgDelL('${s.id}','${l.id}')" title="Post verwijderen">${BGDEL===l.id?'Zeker?':'×'}</button></td></tr>

${l.b.s?`<label class="m" style="font-size:11.5px">Samen-bedrag verdelen<br><select onchange="bgSetL('${s.id}','${l.id}','vd',this.value)"><option value="ink" ${(l.vd||'ink')==='ink'?'selected':''}>Naar inkomen</option><option value="gel" ${l.vd==='gel'?'selected':''}>Gelijk</option>${P.map(p=>`<option value="${p.id}" ${l.vd===p.id?'selected':''}>Alleen ${esc(p.naam)}</option>`).join('')}</select></label>`:''}
${so==='uit'?`<label class="m" style="font-size:11.5px">Waarvan aflossing (vermogensopbouw)<br><input type="text" inputmode="decimal" value="${l.afl?String(l.afl).replace('.',','):''}" placeholder="–" onchange="bgSetL('${s.id}','${l.id}','afl',this.value)" style="width:96px;text-align:right"></label>`:''}
<label class="m" style="font-size:11.5px;flex:1;min-width:200px">Notitie<br><input type="text" value="${esc(l.nt||'')}" onchange="bgSetL('${s.id}','${l.id}','nt',this.value)" style="width:100%"></label></div></td></tr>`:''}`}).join('');
    const sa=act?s.regels.reduce((x,l)=>x+(l.g&&l.g.length?W.L[l.id]||0:0),0):0,sl=act?s.regels.filter(l=>l.g&&l.g.length).reduce((x,l)=>x+C.T[l.id],0):0;
    return`<div class="c tw" style="margin-top:12px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="text" value="${esc(s.naam)}" onchange="bgSetS('${s.id}','naam',this.value)" style="font-weight:650;font-size:15px;min-width:200px" aria-label="Naam van de sectie"><select onchange="bgSetS('${s.id}','soort',this.value)" title="Soort: bepaalt hoe de sectie meetelt">${Object.entries(BGSRT).map(([k,v])=>`<option value="${k}" ${so===k?'selected':''}>${v}</option>`).join('')}</select><span style="flex:1"></span><span class="m">${f0(stot)} per maand</span><button type="button" onclick="bgMoveS('${s.id}',-1)" ${si?'':'disabled'} title="Sectie omhoog">↑</button><button type="button" onclick="bgMoveS('${s.id}',1)" ${si<B.secties.length-1?'':'disabled'} title="Sectie omlaag">↓</button><button type="button" onclick="bgDelS('${s.id}')" title="Sectie verwijderen">${BGDEL===s.id?'Zeker weten?':'Verwijder sectie'}</button></div>

<div style="margin-top:8px"><button type="button" onclick="bgAddL('${s.id}')">+ Post toevoegen</button></div></div>`}).join('');

const PLIC=['💰','🏠','✈️','🚗','🛟','🎓','💍','🏖️','🎁','📈'];
function plGoalAdd(){const v=id=>($('#'+id)||{}).value||'',nm=v('pgn').trim(),tg=num(v('pgt'));if(!nm||!(tg>0)){say('Vul een naam en een doelbedrag in.');return}
  const P=plS();(P.goals=P.goals||[]).push({id:Date.now().toString(36),nm,ic:v('pgi')||'💰',tg,dt:v('pgd'),src:v('pgs')||'man',amt:num(v('pga'))||0});save();render()}
function plGoalSet(id,f,v){const g=(plS().goals||[]).find(x=>x.id===id);if(!g)return;if(f==='tg'||f==='amt'){const n=num(v);g[f]=isNaN(n)?0:n}else g[f]=v;save();render()}
function plGoalDel(id){if(PLDEL!==id){PLDEL=id;render();setTimeout(()=>{if(PLDEL===id){PLDEL=null;render()}},4000);return}PLDEL=null;const P=plS();P.goals=(P.goals||[]).filter(x=>x.id!==id);save();render()}
function plGoals(D){const G=plS().goals||[],W=D.worth,accs=W.acc.slice().sort((a,b)=>b.v-a.v),today=plToday();
  const cur=g=>g.src==='man'?g.amt||0:g.src==='cash'?W.cash:g.src==='all'?W.tot:((W.acc.find(a=>a.a===g.src)||{}).v||0);
  const srcOpt=sel=>`<option value="man" ${sel==='man'?'selected':''}>Handmatig bedrag</option><option value="cash" ${sel==='cash'?'selected':''}>Alle banksaldi (${f0(W.cash)})</option><option value="all" ${sel==='all'?'selected':''}>Totaal vermogen (${f0(W.tot)})</option>${accs.map(a=>`<option value="${esc(a.a)}" ${sel===a.a?'selected':''}>${esc(al(a.a))} · ${f0(a.v)}</option>`).join('')}`;

<div class="pl-form" style="margin-top:14px;position:relative;z-index:1;color:var(--tx)"><label style="color:#fff">Icoon<select id="pgi">${PLIC.map(i=>`<option>${i}</option>`).join('')}</select></label><label style="color:#fff">Naam<input id="pgn" placeholder="bijv. Noodbuffer" style="width:170px"></label><label style="color:#fff">Doelbedrag<input id="pgt" type="number" min="0" step="100" placeholder="10000" style="width:120px"></label><label style="color:#fff">Streefdatum<input id="pgd" type="month"></label><label style="color:#fff">Voortgang uit<select id="pgs" onchange="$('#pgal').hidden=this.value!=='man'">${srcOpt('man')}</select></label><label style="color:#fff" id="pgal">Al gespaard<input id="pga" type="number" min="0" step="50" placeholder="0" style="width:110px"></label><button class="p" onclick="plGoalAdd()" style="background:#fff;color:#0f4f40">＋ Doel toevoegen</button></div></div>`;
  if(!G.length)return h+`<div class="c pl-empty" style="margin-top:12px">Nog geen doelen. Een goede eerste: een <b>noodbuffer</b> van drie maanden vaste lasten, ongeveer <b>${f0(D.typ.exp*3)}</b>.</div>`;
  h+='<div class="pl-g3">'+G.map(g=>{const c=cur(g),f=g.tg?c/g.tg:0,rest=Math.max(0,g.tg-c),ml=g.dt?Math.max(0,(+g.dt.slice(0,4)-+today.slice(0,4))*12+(+g.dt.slice(5,7)-+today.slice(5,7))):null,need=ml?rest/ml:null,eta=sv>0&&rest>0?addM(today,Math.ceil(rest/sv)):null;
    const chip=f>=1?'<span class="pl-chip pl-ok">🎉 Behaald</span>':need==null?'':ml===0?'<span class="pl-chip pl-bad">Datum bereikt</span>':need<=sv*.5?'<span class="pl-chip pl-ok">Ruim haalbaar</span>':need<=sv?'<span class="pl-chip pl-warn">Haalbaar, krap</span>':'<span class="pl-chip pl-bad">Meer sparen nodig</span>';

<div style="display:flex;justify-content:flex-end;margin-top:10px"><button onclick="plGoalDel('${g.id}')" class="${PLDEL===g.id?'p':''}">${PLDEL===g.id?'Zeker weten?':'Verwijderen'}</button></div></div>`}).join('')+'</div>';

/* ---------- Prognose ---------- */
/* spaar- en beleggingsbedragen per maand uit je eigen gegevens: typisch (mediaan) en gemiddeld over de laatste volle maanden, en volgens je begroting */
function plSB(D){const inv={};intPrep();for(const t of S.tx){if(!accOk(t.acct))continue;const w=intWhy(t);if(!w||w.k!=='inv')continue;const k=plK(t.date);inv[k]=(inv[k]||0)-t.amt}
  const ks=D.F12,bel=ks.map(k=>inv[k]||0),sp=ks.map((k,i)=>D.P[k].inc-D.P[k].exp-bel[i]),av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const B=typeof bgS==='function'?bgS():null,C=B?bgCalc(B):null;
  return{n:ks.length,typ:{sp:medOf(sp),bel:medOf(bel)},gem:{sp:av(sp),bel:av(bel)},beg:C?{sp:C.tot.spa,bel:C.tot.bel}:null}}
const PLSRC={man:'Zelf invullen',typ:'Typisch bedrag (mediaan)',gem:'Gemiddeld bedrag',beg:'Volgens mijn begroting'};
function plProgCfg(D){const P=plS(),q=P.prog||{},o=Object.assign({ri:6,rc:1.5,y:15,inf:2,real:false,src:'typ'},q);
  if(o.cs===undefined||o.cb===undefined){if(q.c!==undefined){const sh=(q.sh===undefined?40:q.sh)/100;o.cs=Math.round(q.c*(1-sh));o.cb=Math.round(q.c*sh);if(q.src===undefined)o.src='man'}}
  delete o.c;delete o.sh;const SB=plSB(D);o.SB=SB;if(o.src==='beg'&&!SB.beg)o.src='typ';
  if(o.src!=='man'){const v=SB[o.src];o.cs=Math.max(0,Math.round(v.sp));o.cb=Math.max(0,Math.round(v.bel))}
  if(o.cs===undefined)o.cs=0;if(o.cb===undefined)o.cb=0;return o}
function plProgSrc(v){const o=PLPR||(PLPR=plProgCfg(plData()));o.src=PLSRC[v]?v:'typ';const q=Object.assign({},o);delete q.SB;plS().prog=q;save();PLPR=null;render()}
function plProgIn(el){const k=el.dataset.k,o=PLPR||(PLPR=plProgCfg(plData()));o[k]=k==='real'?el.checked:+el.value;if((k==='cs'||k==='cb')&&o.src!=='man'){o.src='man';const se=$('#plpsrc');if(se)se.value='man';const sh=$('#plpsh');if(sh)sh.textContent='Je eigen bedragen; kies hierboven een andere optie om ze weer uit je gegevens te halen.'}const L=$('#plpv-'+k);if(L)L.textContent=plProgLbl(k,o[k]);const out=$('#plpo');if(out)out.innerHTML=plProgOut(plData(),o)}
function plProgSave(){if(!PLPR)return;const q=Object.assign({},PLPR);delete q.SB;plS().prog=q;save()}
function plProgReset(){delete plS().prog;PLPR=null;save();render()}
const plProgLbl=(k,v)=>k==='cs'||k==='cb'?fmt(v)+' / mnd':k==='y'?v+' jaar':k==='sh'?v+'%':k==='real'?'':v.toLocaleString('nl-NL',{maximumFractionDigits:1})+'%';
function plSim(W,o,dri){const n=o.y*12,ri=(o.ri+(dri||0))/100/12,rc=o.rc/100/12,inf=Math.pow(1+o.inf/100,1/12);let c=W.cash+W.beleg,v=W.dg+W.dgc+(W.fond||0);const R=[{m:0,c,v,t:c+v,r:c+v}];
  for(let m=1;m<=n;m++){c=c*(1+rc)+o.cs;v=v*(1+ri)+o.cb;const t=c+v;R.push({m,c,v,t,r:t/Math.pow(inf,m)})}return R}
function plProgOut(D,o){const W=D.worth,B=plSim(W,o),Lo=plSim(W,o,-3),Hi=plSim(W,o,3),k=o.real?'r':'t',end=B[B.length-1],today=plToday();
  const fi=D.typ.exp*12*25,ms=[100000,250000,500000,1000000].filter(x=>x>W.tot).slice(0,3).map(x=>{const i=B.findIndex(r=>r[k]>=x);return[x,i<0?null:addM(today,i)]});const fiI=B.findIndex(r=>r[k]>=fi);
  const Wd=chW(960),H=300,ml=62,mr=16,mt=14,mb=30,top0=Math.max(...Hi.map(r=>r[k]),1),st=insNice(top0/5),top=Math.ceil(top0/st)*st,x=m=>ml+m/(B.length-1)*(Wd-ml-mr),y=v=>mt+(1-v/top)*(H-mt-mb);
  let g='';for(let v=0;v<=top+1e-9;v+=st)g+=`<line x1="${ml}" x2="${Wd-mr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text class="pl-ax" x="${ml-8}" y="${y(v)+4}" text-anchor="end">${insK(v)}</text>`;
  const yS=Math.max(1,Math.ceil(o.y/10));for(let yy=0;yy<=o.y;yy+=yS)g+=`<text class="pl-ax" x="${x(yy*12)}" y="${H-8}" text-anchor="middle">${+today.slice(0,4)+yy}</text>`;
  const f=o.real?1:0,ln=(R,f2)=>R.map((r,i)=>(i?'L':'M')+x(r.m).toFixed(1)+' '+y(f2(r)).toFixed(1)).join(''),sc=r=>o.real?r.r*(r.c/(r.t||1)):r.c;
  const cash=ln(B,sc),tot=ln(B,r=>r[k]),band=ln(Hi,r=>r[k])+ln(Lo.slice().reverse(),r=>r[k]).replace(/^M/,'L')+'Z';
  const fiL=fi<top?`<line x1="${ml}" x2="${Wd-mr}" y1="${y(fi)}" y2="${y(fi)}" stroke="var(--c5)" stroke-dasharray="6 5"/><text class="pl-ax" x="${Wd-mr-4}" y="${y(fi)-6}" text-anchor="end" style="fill:var(--c3);font-weight:600">financieel onafhankelijk ±${insK(fi)}</text>`:'';
  const tips=B.filter((r,i)=>i%3===0).map(r=>`<rect x="${x(r.m)-((Wd-ml-mr)/B.length*1.5)}" y="${mt}" width="${(Wd-ml-mr)/B.length*3}" height="${H-mt-mb}" fill="transparent"${plTip(MON[+addM(today,r.m).slice(5,7)-1]+' '+addM(today,r.m).slice(0,4)+'\nVerwacht: '+f0(r[k])+'\nWaarvan beleggingen: '+f0(o.real?r.r*(r.v/(r.t||1)):r.v)+'\nBandbreedte: '+f0(Lo[r.m][k])+' – '+f0(Hi[r.m][k]))}/>`).join('');
  const svg=`<svg viewBox="0 0 ${Wd} ${H}" style="width:100%;height:auto;display:block"><defs><linearGradient id="plpg1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--c1)" stop-opacity=".45"/><stop offset="1" stop-color="var(--c1)" stop-opacity=".08"/></linearGradient><linearGradient id="plpg2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--c3)" stop-opacity=".55"/><stop offset="1" stop-color="var(--c3)" stop-opacity=".12"/></linearGradient></defs>${g}<path d="${band}" fill="color-mix(in srgb,var(--c1) 10%,transparent)"/><path d="${tot}L${x(B.length-1)} ${y(0)}L${x(0)} ${y(0)}Z" fill="url(#plpg1)"/><path d="${cash}L${x(B.length-1)} ${y(0)}L${x(0)} ${y(0)}Z" fill="url(#plpg2)"/><path d="${tot}" fill="none" stroke="var(--c1)" stroke-width="2.6"/>${fiL}${tips}</svg>`;
  return`<div class="k" style="margin-top:12px"><div class="c"><span>Vermogen nu</span><b>${fmt(W.tot)}</b><span>bank ${f0(W.cash+W.beleg)} · beleggingen ${f0(W.bel)}</span></div><div class="c"><span>Over ${o.y} jaar${o.real?' (koopkracht nu)':''}</span><b style="color:var(--c1)">${f0(end[k])}</b><span>tussen ${f0(Lo[Lo.length-1][k])} en ${f0(Hi[Hi.length-1][k])}</span></div><div class="c"><span>Zelf ingelegd</span><b>${f0((o.cs+o.cb)*o.y*12)}</b><span>rendement en rente ${f0(end.t-W.tot-(o.cs+o.cb)*o.y*12)}</span></div><div class="c"><span>Maandinkomen uit vermogen</span><b>${f0(end[k]*.04/12)}</b><span>met de 4%-regel, na ${o.y} jaar</span></div></div>
<div class="c" style="margin-top:12px"><div class="pl-h"><b>Verwachte groei</b><span class="m">${o.real?'gecorrigeerd voor '+o.inf+'% inflatie':'nominaal'} · band = rendement ±3%-punt</span></div>${svg}<div class="inl" style="margin-top:6px"><span><i style="background:var(--c1)"></i>Totaal vermogen</span><span><i style="background:var(--c3)"></i>waarvan spaargeld</span><span><i style="background:color-mix(in srgb,var(--c1) 25%,transparent)"></i>Bandbreedte</span></div></div>
<div class="pl-ms" style="margin-top:12px">${ms.map(([v,d])=>`<div><span>${f0(v)} bereikt</span><b>${d?MON[+d.slice(5,7)-1]+' '+d.slice(0,4):'na '+o.y+' jaar'}</b></div>`).join('')}<div><span>Financieel onafhankelijk (25× jaaruitgaven ${f0(fi)})</span><b>${fiI>=0?MON[+addM(today,fiI).slice(5,7)-1]+' '+addM(today,fiI).slice(0,4):'na '+o.y+' jaar'}</b></div></div>`}
function plProg(D){const o=PLPR||(PLPR=plProgCfg(D)),W=D.worth,sl=(k,l,mi,ma,stp)=>`<label>${l}<b id="plpv-${k}">${plProgLbl(k,o[k])}</b><input type="range" data-k="${k}" min="${mi}" max="${ma}" step="${stp}" value="${o[k]}" oninput="plProgIn(this)" onchange="plProgSave()"></label>`;
  return`<div class="pl-hero"><h2>Prognose: waar sta je over ${o.y} jaar?</h2><div class="pl-sub">Startpunt: je huidige banksaldi${W.dgn?' plus DEGIRO ('+(W.dgp?W.dgp+' van '+W.dgn+' posities op ingevulde koers, de rest op kostprijs':'op kostprijs; vul koersen in bij Aandelen › Posities voor de echte waarde')+')':''}. De hypotheek en de waarde van je huis tellen niet mee. Speel met de schuifjes.</div></div>
<div class="c" style="margin-top:12px"><div class="pl-sl">${(()=>{const SB=o.SB,mx=Math.max(3000,Math.ceil(Math.max(o.cs,o.cb,SB.typ.sp,SB.typ.bel,SB.gem.sp,SB.gem.bel,SB.beg?SB.beg.sp:0,SB.beg?SB.beg.bel:0)*2/500)*500),vv=x=>x?'sparen '+f0(x.sp)+', beleggen '+f0(x.bel):'';
  return`<label style="grid-column:1/-1">Spaar- en beleggingsbedrag per maand<select id="plpsrc" onchange="plProgSrc(this.value)" style="margin-top:4px;max-width:520px">${Object.entries(PLSRC).filter(([k])=>k!=='beg'||SB.beg).map(([k,l])=>`<option value="${k}" ${o.src===k?'selected':''}>${l}${k==='man'?'':' · '+vv(SB[k])}</option>`).join('')}</select><span id="plpsh" class="m" style="font-size:11.5px;font-weight:400;margin-top:3px">${o.src==='typ'?'De typische maand van de laatste '+SB.n+' volle maanden: de helft van de maanden was lager, de helft hoger.':o.src==='gem'?'Het gemiddelde over de laatste '+SB.n+' volle maanden.':o.src==='beg'?'Uit je Maandelijkse begroting (secties Sparen en Beleggen).':'Je eigen bedragen; kies hierboven een andere optie om ze weer uit je gegevens te halen.'} Sparen = wat er als cash overblijft (inkomen − uitgaven − beleggen), beleggen = wat je naar een broker of fonds overmaakt.${(o.src==='typ'||o.src==='gem')&&SB[o.src].sp<0?' Je spaarbedrag was negatief en staat op € 0.':''}</span></label>`+sl('cs','Sparen per maand',0,mx,1)+sl('cb','Beleggen per maand',0,mx,1)})()}${sl('ri','Rendement beleggingen',0,20,.5)}${sl('rc','Rente spaargeld',0,5,.1)}${sl('y','Horizon',1,40,1)}${sl('inf','Inflatie',0,6,.1)}<label style="flex-direction:row;align-items:center;gap:8px;align-self:end"><input type="checkbox" data-k="real" ${o.real?'checked':''} onchange="plProgIn(this);plProgSave()"> in koopkracht van nu</label></div><div style="margin-top:8px;display:flex;gap:8px;align-items:center"><span class="m" style="font-size:12px">Een schuifje verplaatsen zet de keuze op “Zelf invullen”. Rendement tot 20% per jaar is mogelijk, maar reken voor de lange termijn liever met 4 tot 8%.</span><span style="flex:1"></span><button onclick="plProgReset()">Terug naar standaard</button></div></div>
<div id="plpo">${plProgOut(D,o)}</div><p class="pl-note">Dit is een rekenvoorbeeld, geen advies of garantie: rendementen schommelen, en belasting (box 3) en kosten zijn niet meegenomen.</p>`}

/* ---------- Kalender ---------- */
function plDay(d){const ids=(PLC?PLC.B:[]).filter(t=>t.date===d).map(t=>t.id);plGo(ids,plDY(d))}
function plCal(D){const A=D.asOf,today=plToday(),day={},cnt={};D.B.forEach(t=>{if(t.amt<0){day[t.date]=(day[t.date]||0)-t.amt;cnt[t.date]=(cnt[t.date]||0)+1}});
  const end=A,start0=addD(end,-364),start=addD(start0,-wdOf(start0)),nd=dDiff(start,end)+1,vals=[];for(let i=0;i<nd;i++){const d=addD(start,i);if(d>=start0)vals.push(day[d]||0)}
  const nz=vals.filter(v=>v>0).sort((a,b)=>a-b),qq=f=>nz.length?nz[Math.floor((nz.length-1)*f)]:0,th=[qq(.2),qq(.4),qq(.6),qq(.8)];
  const lvl=v=>v<=0?0:v<=th[0]?1:v<=th[1]?2:v<=th[2]?3:v<=th[3]?4:5,op=[0,.18,.34,.52,.72,.95];
  const cs=13,gp=3,wk=Math.ceil(nd/7),Wd=34+wk*(cs+gp),H=22+7*(cs+gp);let s='',lm='';
